server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Send relative redirects (/about -> /about/). Absolute ones are built as
    # http://<host>/..., which breaks behind a TLS-terminating reverse proxy.
    absolute_redirect off;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
